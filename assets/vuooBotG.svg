  <!--
    A cabeça são os dois OO, exatamente como no logo: dois elementos por olho.
      -02  o vazado do O (o preenchimento escuro). É o que o olhar desloca, e o anel
           o recorta, então ele nunca sai de dentro da letra.
      -01  o anel tipográfico do O. Faz o papel do "branco do olho": é a sua caixa
           que define o quanto o vazado pode andar.
    Não há brilho; o motor trata esse elemento como opcional.
    O -backdrop é a mesma forma do vazado, pintada com a cor de fundo da página
    (style.css). Fica inteiramente escondido sob o vazado em repouso; só existe para
    que a fresta aberta pelo olhar mostre o fundo, e não as partículas que orbitam
    atrás da cabeça.
    O olho "left"/"right" é do ponto de vista do personagem, como no arquivo anterior.
  -->
  <g id="head">
    <g id="right-eye">
      <rect id="right-eye-backdrop" x="875.999" y="638" width="95" height="238" rx="47.5" fill="#0B0F14"/>
      <rect id="right-eye-02" x="875.999" y="638" width="95" height="238" rx="47.5" fill="#2C2C2C"/>
      <path id="right-eye-01" fill-rule="evenodd" clip-rule="evenodd" d="M922.999 597C970.496 597 1009 635.504 1009 683V831C1009 878.496 970.496 917 922.999 917C875.503 917 836.999 878.496 836.999 831V683C836.999 635.504 875.503 597 922.999 597ZM923.499 638C897.265 638 875.999 659.266 875.999 685.5V828.5C875.999 854.734 897.265 876 923.499 876C949.733 876 970.999 854.734 970.999 828.5V685.5C970.999 659.266 949.733 638 923.499 638Z" fill="#F2F2F2"/>
    </g>

