<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VUOO Bot G</title>
  <script>
    // Applied before first paint so a saved light theme doesn't flash dark.
    try {
      const theme = localStorage.getItem('vuooBot.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>

  <!-- The favicon follows the browser/OS theme (the tab bar), not the page theme toggle. -->
  <link rel="icon" href="assets/favicon-32-dark.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="assets/favicon-32-light.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!--
    Cache busting: GitHub Pages lets browsers cache files for 10 minutes, which can mix a new
    page with old scripts. Bump v= in ALL of the URLs below on every deploy. The import map
    also versions the modules imported from inside other modules.
  -->
  <link rel="stylesheet" href="style.css?v=6" />
  <script type="importmap">
    {
      "imports": {
        "./src/svg-loader.js": "./src/svg-loader.js?v=6",
        "./src/animation-engine.js": "./src/animation-engine.js?v=6",
        "./src/behaviours.js": "./src/behaviours.js?v=6",
        "./src/state-machine.js": "./src/state-machine.js?v=6",
        "./src/events.js": "./src/events.js?v=6",
        "./src/interaction.js": "./src/interaction.js?v=6"
      }
    }
  </script>
</head>
<body>
  <!-- Shared filter definitions; units are the bot SVG's (viewBox 1322 wide). -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Tight dark contact shadow + long soft ambient shadow, both straight down. -->
      <filter id="eye-shadow" x="-60%" y="-40%" width="220%" height="200%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="contactBlur" />
        <feOffset in="contactBlur" dy="12" result="contactOffset" />
        <feFlood flood-color="#0b0f14" flood-opacity="0.45" />
        <feComposite in2="contactOffset" operator="in" result="contact" />
        <feGaussianBlur in="SourceAlpha" stdDeviation="28" result="ambientBlur" />
        <feOffset in="ambientBlur" dy="40" result="ambientOffset" />
        <feFlood flood-color="#0b0f14" flood-opacity="0.3" />
        <feComposite in2="ambientOffset" operator="in" result="ambient" />
        <feMerge>
          <feMergeNode in="ambient" />
          <feMergeNode in="contact" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <main class="stage">
    <div id="vuooBot" class="bot"></div>
  </main>

  <aside class="panel">
    <section>
      <h2>Tema</h2>
      <div class="buttons">
        <button data-theme-choice="dark" aria-pressed="true">Escuro</button>
        <button data-theme-choice="light" aria-pressed="false">Claro</button>
      </div>
    </section>

    <section>
      <h2>Estados</h2>
      <div class="buttons">
        <button data-state="IDLE">Idle</button>
        <button data-state="ATTENTION">Attention</button>
        <button data-state="LOOKING">Looking</button>
        <button data-state="THINKING">Thinking</button>
        <button data-state="HAPPY">Happy</button>
        <button data-state="SURPRISED">Surprised</button>
        <button data-state="SLEEPING">Sleeping</button>
      </div>
    </section>

    <section>
      <h2>Eventos</h2>
      <div class="buttons">
        <button data-event="attention">attention</button>
        <button data-event="thinking">thinking</button>
        <button data-event="happy">happy</button>
        <button data-event="surprised">surprised</button>
      </div>
    </section>

    <section>
      <h2>Especiais</h2>
      <div class="buttons">
        <button data-event="spin" class="special">spin</button>
        <button id="orbit-toggle" class="special" aria-pressed="false">órbita 3D</button>
      </div>
    </section>

    <section>
      <h2>Ajustes</h2>
      <div id="tuning" class="tuning"></div>
      <div class="buttons">
        <button id="tuning-reset">Restaurar padrões</button>
        <button id="tuning-copy">Copiar valores</button>
      </div>
    </section>
  </aside>

  <script type="module" src="animation.js?v=6"></script>
</body>
</html>
